<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aden Khan portfolio: design direction canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;900&family=Bricolage+Grotesque:wght@400;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ---------- canvas shell ---------- */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #101114; color: #d8dae3; font: 14px/1.4 system-ui, sans-serif; }
#viewport { position: fixed; inset: 0; cursor: default; touch-action: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.item { position: absolute; }
.item > .name { position: absolute; bottom: 100%; left: 0; margin-bottom: 10px; font: 600 15px/1.2 system-ui, sans-serif; color: #d8dae3; white-space: nowrap; background: none; border: 0; padding: 4px 0; cursor: default; }
.item > .name:hover, .item > .name:focus-visible { color: #fff; text-decoration: underline; outline: none; }
.colhead { position: absolute; width: 1100px; font: 700 28px/1.1 system-ui, sans-serif; color: #fff; }
.colhead small { display: block; margin-top: 6px; font: 400 14px/1.4 system-ui, sans-serif; color: #9a9eb0; max-width: 1100px; }
#bar { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 10; align-items: center; }
#bar button { font: 600 13px system-ui, sans-serif; color: #e9eaf0; background: #1c1e26; border: 1px solid #3a3d4c; border-radius: 6px; padding: 7px 11px; cursor: pointer; }
#bar button:hover { background: #262935; }
#bar button:focus-visible { outline: 2px solid #7aa7ff; outline-offset: 2px; }
#bar span { color: #8a8ea0; font-size: 12px; margin-left: 8px; }
#toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #1c1e26; border: 1px solid #3a3d4c; padding: 6px 12px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .15s; pointer-events: none; }
#toast.on { opacity: 1; }

/* ---------- shared frame content ---------- */
.frame { position: relative; overflow: hidden; color: var(--text); background: var(--bg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.frame a { color: inherit; }
.frame h1, .frame h2, .frame h3, .frame p { margin: 0; }
.frame.d { width: 1100px; }
.frame.m { width: 390px; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 40px; position: relative; z-index: 3; }
.m .nav { padding: 14px 18px; }
.logo { font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: .02em; }
.links { display: flex; gap: 26px; align-items: center; }
.links a { text-decoration: none; font-size: 15px; color: var(--muted); }
.links a[aria-current] { color: var(--text); }
.m .links a:not(.btn) { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; font: 600 15px var(--body); text-decoration: none; cursor: pointer; border: 0; }
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; padding: 48px 40px 40px; position: relative; z-index: 2; align-items: center; }
.m .hero { grid-template-columns: 1fr; padding: 28px 18px 24px; gap: 28px; }
.hud { font: 400 13px var(--mono); color: var(--blue); }
h1 { font-family: var(--display); font-size: 92px; line-height: .92; letter-spacing: 0; }
.frame h1 { margin: 14px 0 22px; }
.m h1 { font-size: 56px; }
.sub { font-size: 19px; max-width: 34ch; color: var(--muted); }
.m .sub { font-size: 17px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.avatar { position: relative; aspect-ratio: 4 / 5; }
.avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.avatar .ph { position: absolute; left: 10px; bottom: 8px; font: 400 11px var(--mono); color: var(--muted); z-index: 3; }
.stats-bars { display: grid; gap: 8px; margin-top: 14px; }
.stats-bars div { display: flex; align-items: center; gap: 10px; font: 400 13px var(--mono); color: var(--muted); }
.stats-bars i { flex: 1; height: 4px; background: linear-gradient(90deg, var(--red), var(--purple), var(--blue)); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 8px 40px 0; position: relative; z-index: 2; }
.m .strip { grid-template-columns: 1fr 1fr; margin: 0 18px; }
.strip div { padding: 18px 16px 18px 0; }
.strip b { display: block; font: 900 44px/1 var(--display); }
.m .strip b { font-size: 38px; }
.strip span { font-size: 14px; color: var(--muted); }
.section { padding: 56px 40px 8px; position: relative; z-index: 2; }
.m .section { padding: 40px 18px 8px; }
h2 { font-family: var(--display); font-size: 44px; line-height: 1; }
.frame h2 { margin-bottom: 24px; }
.m h2 { font-size: 34px; }
.mission .tag { font: 400 12px var(--mono); color: var(--muted); }
.mission h3 { font: 900 30px/1.05 var(--display); margin: 6px 0 8px; }
.mission .where { color: var(--muted); font-size: 15px; }
.mission .result { margin-top: 12px; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.m .panels { grid-template-columns: 1fr; }
.panel { position: relative; padding: 22px; min-height: 190px; }
.panel .arc { font: 400 12px var(--mono); color: var(--muted); }
.panel h3 { font: 900 28px/1 var(--display); margin: 6px 0 8px; }
.panel p { font-size: 15px; color: var(--muted); }
.foot { height: 56px; }

/* ================= A. Neon cyber HUD ================= */
.dA { --bg: #060A14; --text: #E9F4FF; --muted: #A5B6CC; --red: #FF4D6A; --blue: #3DB0FF; --purple: #A77CFF; --display: 'Rajdhani', sans-serif; --body: 'Barlow', sans-serif; --mono: 'Share Tech Mono', monospace;
  background-image: linear-gradient(rgba(61,176,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(61,176,255,.07) 1px, transparent 1px); background-size: 40px 40px; }
.dA::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); pointer-events: none; z-index: 5; }
.dA .nav { border-bottom: 1px solid rgba(61,176,255,.35); }
.dA .logo { color: var(--blue); text-shadow: 0 0 14px rgba(61,176,255,.8); }
.dA h1 { text-transform: uppercase; font-weight: 700; text-shadow: 0 0 22px rgba(167,124,255,.55); }
.dA .btn { clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.dA .btn.pri { background: var(--red); color: #07080F; box-shadow: 0 0 24px rgba(255,77,106,.6); }
.dA .btn.sec { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
.dA .avatar { border: 1px solid rgba(61,176,255,.6); background: radial-gradient(circle at 50% 40%, rgba(167,124,255,.35), transparent 65%), #0A1020; box-shadow: 0 0 40px rgba(61,176,255,.25); }
.dA .avatar::before, .dA .avatar::after { content: ''; position: absolute; width: 26px; height: 26px; border: 3px solid var(--red); z-index: 3; }
.dA .avatar::before { left: -6px; top: -6px; border-right: 0; border-bottom: 0; }
.dA .avatar::after { right: -6px; bottom: -6px; border-left: 0; border-top: 0; border-color: var(--blue); }
.dA .strip { border-top: 1px solid rgba(61,176,255,.35); border-bottom: 1px solid rgba(61,176,255,.35); padding-left: 0; }
.dA .strip b { color: var(--blue); text-shadow: 0 0 14px rgba(61,176,255,.7); }
.dA h2 { text-transform: uppercase; color: var(--text); }
.dA .mission { border: 1px solid rgba(61,176,255,.55); padding: 24px; background: rgba(10,16,32,.85); position: relative; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }
.dA .mission .tag { color: var(--red); }
.dA .mission .result { color: var(--blue); font-weight: 500; }
.dA .panel { border: 1px solid rgba(167,124,255,.6); background: rgba(14,18,40,.85); }
.dA .panel::before { content: ''; position: absolute; left: -1px; top: -1px; width: 18px; height: 18px; border-left: 3px solid var(--red); border-top: 3px solid var(--red); }
.dA .panel .arc { color: var(--purple); }

/* ================= B. Ink & halftone manga ================= */
.dB { --bg: #0D0D12; --text: #F4F2EA; --muted: #BDBBB2; --red: #FF4D6A; --blue: #3DB0FF; --purple: #A77CFF; --display: 'Anton', sans-serif; --body: 'Bricolage Grotesque', sans-serif; --mono: 'Space Mono', monospace; }
.dB::before { content: ''; position: absolute; right: -80px; top: -80px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(244,242,234,.22) 1.6px, transparent 2.2px) 0 0/12px 12px; mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%); -webkit-mask-image: radial-gradient(circle at 70% 30%, #000, transparent 70%); pointer-events: none; }
.dB .nav { border-bottom: 4px solid var(--text); }
.dB .logo { font-family: var(--display); font-weight: 400; background: var(--text); color: var(--bg); padding: 0 10px; transform: rotate(-3deg); }
.dB h1 { text-transform: uppercase; font-weight: 400; font-size: 118px; line-height: .88; }
.dB.m h1, .dB .m h1 { font-size: 72px; }
.m.dB h1 { font-size: 72px; }
.dB .hud { color: var(--bg); background: var(--blue); display: inline-block; padding: 2px 8px; font-weight: 700; }
.dB .btn { border: 3px solid var(--text); font-weight: 700; box-shadow: 6px 6px 0 var(--red); text-transform: uppercase; font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: .04em; }
.dB .btn.pri { background: var(--text); color: var(--bg); }
.dB .btn.sec { background: var(--bg); color: var(--text); box-shadow: 6px 6px 0 var(--blue); }
.dB .avatar { border: 5px solid var(--text); background: repeating-conic-gradient(from 0deg at 50% 55%, #1a1a24 0 6deg, #0D0D12 6deg 12deg); box-shadow: 10px 10px 0 var(--purple); transform: rotate(1.5deg); }
.dB .stats-bars div { color: var(--text); }
.dB .strip div { border-right: 3px solid var(--text); padding-left: 16px; }
.dB .strip div:first-child { padding-left: 0; }
.dB .strip div:last-child { border-right: 0; }
.dB .strip b { font-family: var(--display); font-weight: 400; font-size: 56px; color: var(--text); }
.dB .strip div:nth-child(1) b { color: var(--blue); }
.dB h2 { text-transform: uppercase; font-weight: 400; font-size: 56px; }
.dB .mission { border: 4px solid var(--text); padding: 24px; box-shadow: 9px 9px 0 var(--blue); background: #15151d; }
.dB .mission h3 { font-family: var(--display); font-weight: 400; font-size: 38px; text-transform: uppercase; }
.dB .mission .tag { color: var(--bg); background: var(--red); display: inline-block; padding: 1px 8px; font-weight: 700; }
.dB .mission .result { font-weight: 600; }
.dB .panels { gap: 22px; }
.dB .panel { border: 4px solid var(--text); background: #15151d; }
.dB .panel:nth-child(1) { grid-row: span 1; box-shadow: 7px 7px 0 var(--red); transform: rotate(-.6deg); }
.dB .panel:nth-child(2) { box-shadow: 7px 7px 0 var(--red); transform: rotate(.5deg); }
.dB .panel:nth-child(3) { box-shadow: 7px 7px 0 var(--blue); transform: rotate(.4deg); }
.dB .panel:nth-child(4) { box-shadow: 7px 7px 0 var(--purple); transform: rotate(-.5deg); background: #1b1530; }
.dB .panel::after { content: ''; position: absolute; right: 0; bottom: 0; width: 90px; height: 90px; background: radial-gradient(circle, rgba(244,242,234,.35) 1.4px, transparent 2px) 0 0/9px 9px; mask-image: linear-gradient(135deg, transparent 40%, #000); -webkit-mask-image: linear-gradient(135deg, transparent 40%, #000); }
.dB .panel h3 { font-family: var(--display); font-weight: 400; font-size: 34px; text-transform: uppercase; }
.dB .panel .arc { color: var(--text); font-weight: 700; }
.dB .panel p { color: var(--text); }

/* ================= C. Clean futuristic, anime accents ================= */
.dC { --bg: #0B0D1A; --surface: #12152A; --line: #2A2F52; --text: #F2F3FA; --muted: #B4B9D6; --red: #FF4D6A; --blue: #3DB0FF; --purple: #A77CFF; --display: 'Big Shoulders Display', sans-serif; --body: 'Instrument Sans', sans-serif; --mono: 'JetBrains Mono', monospace; }
.dC .nav { padding-top: 26px; }
.dC .logo { font-size: 28px; }
.dC .hero { padding-top: 64px; padding-bottom: 56px; }
.dC.m .hero { padding-top: 36px; }
.dC h1 { font-weight: 900; font-size: 108px; line-height: .9; }
.dC.m h1 { font-size: 64px; }
.dC .hud { color: var(--muted); font-size: 12px; }
.dC .hud b { color: var(--red); font-weight: 400; }
.dC .btn { border-radius: 999px; }
.dC .btn.pri { background: linear-gradient(100deg, var(--red), var(--purple) 55%, var(--blue)); color: #0B0D1A; }
.dC .btn.sec { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px #5A6199; }
.dC .avatar { border-radius: 24px 24px 24px 80px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.dC .orbs::before, .dC .orbs::after { content: ''; position: absolute; border-radius: 50%; filter: blur(34px); z-index: 0; }
.dC .orbs::before { width: 62%; aspect-ratio: 1; left: -12%; top: 6%; background: radial-gradient(circle at 40% 40%, #FF4D6A, rgba(255,77,106,0) 70%); }
.dC .orbs::after { width: 62%; aspect-ratio: 1; right: -12%; top: 16%; background: radial-gradient(circle at 60% 40%, #3DB0FF, rgba(61,176,255,0) 70%); }
.dC .orbs .mix { position: absolute; left: 28%; top: 16%; width: 44%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(167,124,255,.85), rgba(167,124,255,0) 68%); filter: blur(22px); z-index: 0; }
.dC .strip { border-top: 1px solid var(--line); margin-top: 0; padding-top: 6px; }
.dC .strip b { font-weight: 900; }
.dC .strip div:nth-child(1) b { color: var(--red); }
.dC .strip div:nth-child(2) b { color: var(--blue); }
.dC .strip div:nth-child(3) b { color: var(--purple); }
.dC .strip div:nth-child(4) b { color: var(--text); }
.dC h2 { font-weight: 900; font-size: 52px; }
.dC.m h2 { font-size: 38px; }
.dC .mission { display: grid; grid-template-columns: 6px 1fr; gap: 22px; background: var(--surface); border-radius: 4px 28px 4px 4px; padding: 26px 28px 26px 0; }
.dC .mission::before { content: ''; background: linear-gradient(180deg, var(--red), var(--purple)); border-radius: 0 4px 4px 0; }
.dC .mission .tag { color: var(--red); }
.dC .mission .result { font-size: 18px; }
.dC .panels { gap: 14px; }
.dC .panel { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 26px), calc(100% - 26px) 100%, 0 100%); padding: 24px; }
.dC .panel:nth-child(1) { border-top: 3px solid var(--red); }
.dC .panel:nth-child(2) { border-top: 3px solid #D86A94; }
.dC .panel:nth-child(3) { border-top: 3px solid #7C8FF0; }
.dC .panel:nth-child(4) { border-top: 3px solid var(--blue); background: linear-gradient(135deg, #1a1740, var(--surface)); }
.dC .panel .arc { color: var(--muted); }
.dC .panel:nth-child(1) .arc { color: var(--red); }
.dC .panel:nth-child(4) .arc { color: var(--blue); }
.dC .panel:nth-child(2) { margin-top: 0; }
</style>
</head>
<body>
<div id="viewport"><div id="world"></div></div>
<div id="bar" role="toolbar" aria-label="Canvas controls">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="fit">Fit all</button>
  <button id="reset">Reset</button>
  <span>Drag to pan. Ctrl + wheel or pinch to zoom. Click a name to copy it.</span>
</div>
<div id="toast" role="status" aria-live="polite">Copied</div>
<script>
const AVATAR = `<svg viewBox="0 0 200 250" role="img" aria-label="Placeholder for the illustrated avatar"><g fill="none" stroke-linejoin="round">
<path d="M30 250c4-52 34-72 70-72s66 20 70 72z" fill="var(--purple)" fill-opacity=".85"/>
<rect x="86" y="140" width="28" height="40" fill="#F0C9A8"/>
<ellipse cx="100" cy="112" rx="38" ry="46" fill="#F0C9A8"/>
<path d="M58 106 52 52 78 70 84 34 104 66 124 30 130 70 150 50 142 106c-6-26-24-38-42-38S64 80 58 106z" fill="var(--red)"/>
<path d="M76 120h18M110 120h18" stroke="#0B0D1A" stroke-width="5" stroke-linecap="round"/>
<path d="M90 142c6 5 14 5 20 0" stroke="#0B0D1A" stroke-width="3" stroke-linecap="round"/>
<circle cx="150" cy="190" r="14" fill="var(--blue)" fill-opacity=".9"/></g></svg>`;

const COPY = {
  hud: ['// PLAYER 01', 'PRODUCT MARKETER', 'KARACHI'],
  h1: 'Aden Khan, Product Marketer',
  sub: 'I connect what customers feel with what the data shows, then build the systems that scale it.',
  bars: ['Positioning', 'Analytics', 'Automation', 'Paid growth'],
  stats: [['−72%', 'customer acquisition cost'], ['+40%', 'program awareness'], ['$7,000+', 'sponsorships secured'], ['4', 'marketing roles since 2025']],
  mission: { tag: 'Mission 1 · Creative', title: 'Lower the cost of growth', where: 'Sadiq.ai, Product Marketing Associate', result: 'Performance-driven Meta campaigns cut customer acquisition cost by 72%' },
  arcs: [
    ['Arc 1', 'Storyteller (2025)', 'Ran LinkedIn and Instagram campaigns for the i2iScale accelerator program, raising awareness 40%.'],
    ['Arc 2', 'Growth (2025)', 'At Sadiq.ai, used Amplitude to improve onboarding, retention and feature adoption, and ran Meta campaigns that cut acquisition cost 72%.'],
    ['Arc 3', 'Go-to-market (2025–26)', 'Researched partners and investors for Leasap, a U.S. proptech startup, and built its outreach pipelines.'],
    ['Arc 4', 'Builder (2026)', 'At 10Pearls, shipped an SEO content app and automated marketing workflows in HubSpot and n8n.']
  ]
};

function frame(dir, mobile) {
  const hud = dir === 'C' ? `<span class="hud"><b>//</b> PLAYER 01 · PRODUCT MARKETER · KARACHI</span>` : `<span class="hud">${COPY.hud.join(' · ')}</span>`;
  const orbs = dir === 'C' ? '<div class="orbs" style="position:absolute;inset:0"><i class="mix"></i></div>' : '';
  return `<div class="frame ${mobile ? 'm' : 'd'} d${dir}">
  <nav class="nav" aria-label="Main"><span class="logo">AK</span><div class="links"><a href="#" aria-current="page">Home</a><a href="#">About</a><a href="#">Work</a><a href="#">Contact</a><a class="btn ${dir === 'B' ? 'pri' : 'sec'}" href="#" style="min-height:44px;padding:8px 18px">CV</a></div></nav>
  <header class="hero">
    <div>${hud}<h1>${COPY.h1}</h1><p class="sub">${COPY.sub}</p>
      <div class="cta"><a class="btn pri" href="#">Download CV</a><a class="btn sec" href="#">See my missions</a></div></div>
    <div><div class="avatar">${orbs}${AVATAR}<span class="ph">avatar placeholder</span></div>
      <div class="stats-bars">${COPY.bars.map(b => `<div>${b}<i></i></div>`).join('')}</div></div>
  </header>
  <section class="strip" aria-label="Results">${COPY.stats.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</section>
  <section class="section"><h2>Product marketing missions, completed</h2>
    <article class="mission"><div><span class="tag">${COPY.mission.tag}</span><h3>${COPY.mission.title}</h3><p class="where">${COPY.mission.where}</p><p class="result">${COPY.mission.result}</p></div></article></section>
  <section class="section"><h2>The origin arc: from campaigns to products</h2>
    <div class="panels">${COPY.arcs.map(a => `<article class="panel"><span class="arc">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p></article>`).join('')}</div></section>
  <div class="foot"></div></div>`;
}

const DIRS = [
  { id: 'A', name: 'A. Neon cyber HUD', note: 'Grid and scanline background, glowing red and blue neon, chamfered buttons, corner brackets. Maximum HUD, highest effect cost.' },
  { id: 'B', name: 'B. Ink and halftone manga', note: 'Thick panel borders, hard offset shadows, halftone dots, tilted panels, condensed caps. Most graphic, least calm for reading.' },
  { id: 'C', name: 'C. Clean futuristic, anime accents', note: 'Quiet dark navy, one orb collision behind the avatar, thin lines, cut-corner manga panels. Content leads, style supports.' }
];
const PITCH = 1700, MOBILE_X = 1180, TOP = 120;
const world = document.getElementById('world');
DIRS.forEach((d, i) => {
  const x = i * PITCH;
  world.insertAdjacentHTML('beforeend', `<div class="colhead" style="left:${x}px;top:0">${d.name}<small>${d.note}</small></div>`);
  [['Home, mission and About, desktop 1100px', frame(d.id, false), x], ['Home, mission and About, mobile 390px', frame(d.id, true), x + MOBILE_X]].forEach(([n, html, px]) => {
    world.insertAdjacentHTML('beforeend', `<div class="item" style="left:${px}px;top:${TOP}px"><button class="name" type="button" title="Click to copy this name">${d.name} · ${n}</button>${html}</div>`);
  });
});

/* ---------- camera ---------- */
const vp = document.getElementById('viewport');
let cam = { x: 40, y: 80, s: 0.2 };
const clampS = s => Math.min(2, Math.max(0.05, s));
function apply() { world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.s})`; }
function bounds() { let w = 0, h = 0; world.querySelectorAll('.item, .colhead').forEach(e => { w = Math.max(w, e.offsetLeft + e.offsetWidth); h = Math.max(h, e.offsetTop + e.offsetHeight); }); return { w, h }; }
function fit() { const b = bounds(); const s = clampS(Math.min((innerWidth - 80) / b.w, (innerHeight - 140) / b.h)); cam = { s, x: (innerWidth - b.w * s) / 2, y: 80 }; apply(); }
function zoomAt(px, py, f) { const s = clampS(cam.s * f); const k = s / cam.s; cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = s; apply(); }
document.getElementById('zin').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
document.getElementById('zout').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
document.getElementById('fit').onclick = fit;
document.getElementById('reset').onclick = () => { cam = { x: 40, y: 80, s: 0.5 }; apply(); };
vp.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01)); else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); } }, { passive: false });
let drag = null, moved = false;
vp.addEventListener('pointerdown', e => { if (e.target.closest('.name')) return; drag = { x: e.clientX - cam.x, y: e.clientY - cam.y }; moved = false; vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove', e => { if (!drag) return; moved = true; cam.x = e.clientX - drag.x; cam.y = e.clientY - drag.y; apply(); });
['pointerup', 'pointercancel'].forEach(t => vp.addEventListener(t, () => { drag = null; }));
vp.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
vp.addEventListener('click', e => e.target.closest('a[href="#"]') && e.preventDefault());
world.addEventListener('click', async e => { const b = e.target.closest('.name'); if (!b) return; const t = document.getElementById('toast'); try { await navigator.clipboard.writeText(b.textContent); t.textContent = 'Copied'; } catch { t.textContent = 'Copy not available; select the name text'; } t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1100); });
document.fonts.ready.then(() => requestAnimationFrame(fit));
addEventListener('resize', fit);
</script>
</body>
</html>
